name: Portal CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://account.example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_value
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Cross-repository preflight intentionally runs only in the integrated workspace;
      # a standalone checkout validates all portal-owned contracts here.
      - run: npm run validate:portal
      - run: npx playwright install --with-deps chromium
      - name: e2e
        # The job-level NEXT_PUBLIC_SITE_URL is a deliberately unresolvable placeholder,
        # which is right for `npm run build` — nothing should reach a real host at build
        # time. It is wrong here. These tests run the server for real, and `/auth/confirm`
        # redirects to an absolute URL built from this value, so the browser was sent to
        # `account.example.invalid` and failed to resolve it. That read as a failure of the
        # open-redirect test, which is the one test in the suite whose failure looks like a
        # security regression; it was configuration.
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
